services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: vuejobs-postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: vuejobs-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
